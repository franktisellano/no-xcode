# Source of truth for the Xcode project. `make gen` (xcodegen) writes __APP__.xcodeproj,
# which is gitignored. Never edit the .xcodeproj; edit this file and regenerate.
# Reference: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: __APP__
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: __TEAM_ID__
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    # Overwritten with a timestamp by tools/testflight-upload.sh.
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  __APP__:
    type: application
    platform: iOS
    sources:
      - __APP__
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: __APP__/Info.plist
      properties:
        CFBundleDisplayName: "__DISPLAY_NAME__"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - __APP__Tests
        - __APP__UITests
      gatherCoverageData: false

  __APP__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - __APP__Tests
    dependencies:
      - target: __APP__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.tests
        GENERATE_INFOPLIST_FILE: YES

  __APP__UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - __APP__UITests
    dependencies:
      - target: __APP__
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: __APP__
